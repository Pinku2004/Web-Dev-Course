<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix Clone Project</title>
    <link rel="stylesheet" href="style.css" >
</head>
<body>
    <div class="main">
        <nav >
            <span><img src="Assets/Images/logo.svg" alt="Netflix Logo" style="height:40px"></span>

            <div class="btn">
                <button class="btn1"><img src="Assets/Images/1.svg">English<img src="Assets/Images/2.svg"></button>

                <button class="btn2">Sign In</button>
            </div>
        </nav>
        <div class="box"></div>
        <div class="hero">
            <span>Unlimited movies, TV shows, and more</span>
            <span>Watch anywhere. Cancel anytime.</span>
            <span>Ready to watch? Enter your email to create or restart your membership.</span>

            <div class="hero1">
                <input class="input" type="text" id="email" name="email" placeholder="Email address">
                <button class="red">Get Started ></button>
            </div>
        </div>
    </div>
</body>
</html>
