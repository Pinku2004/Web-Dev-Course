<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Name Generator</title>
</head>
<body>
    <script>
        /* Make a Business Name Generator by combining adjectives and shop names and another word
        Adjectives:
        Crazy   
        Amazing
        Fire

        Shop Name:
        Engine
        Foods
        Garments

        Another Word:
        Bros 
        Limited
        Hub
        */

        let random = Math.random();
        console.log(random);
        let first,second,third;

        if(random<0.33){
            first="Crazy";
        }else if(random>0.33 && random<0.66){
            first="Amazing";
        }else{
            first="Fire";
        }
        if(random<0.33){
            second="Engine";
        }else if(random>0.33 && random<0.66){
            second="Foods";
        }else{
            second="Garment";
        }
        if(random<0.33){
            third="Bros";
        }else if(random>0.33 && random<0.66){
            third="Limited";
        }else{
            third="Hubs";
        }

        console.log(`${first} ${second} ${third}`);

        </script>
    </body>
</html>
