<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookmark Manager - CodeWithPinku</title>
</head>
<body>
    <h1>My Bookmarks</h1>
    <h3>Primary Bookmark</h3>
    <a href="https://www.google.com" target="_blank">Open Google</a>

    <h3>Secondary Bookmark</h3>
    <a href="https://www.wikipedia.com" target="_blank">Open Wikipedia</a>
    <img width = "500" height=" 300"src="images.jpg" alt="Plane Image">
    <table>
        <tr>
            <th>Name</th>
            <th>Destination</th>
            <th>Pincode</th>
        </tr>
        <tr>
            <td colspan="2">Priyanka</td>
            <td>753004</td>
        </tr>
    </table>
    <ul type="square">
        <li>Onion</li>
        <li>Tomato</li>
    </ul>
    <ol type="a">
        <li>Onion</li>
        <li>Tomato</li>
    </ol>
</body>
</html>
