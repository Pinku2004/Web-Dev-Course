<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website with videos and audios</title>
    <meta name="description" content="Website that shows videos and audios of different categories">
    <link rel="stylesheet" href="Styles.css">
</head>
<body>
    <h2 class="video">VIDEO AND AUDIO</h2>
    <div>
        <h3 class="video">VIDEO</h3><br>
        <u>(i)Educational</u>
        <br>
        <video src="Educational.mp4" controls width="300" height="200" poster="Ed.jpg"></video>
        &lt;p&gt;&lt;/p&gt;
    </div>
    <div>
        <h3 class="video">AUDIO</h3><br>
        <u>(i)Music</u>
        <br>
        <br>
        <audio src="audio.mp3" controls preload="none"></audio>
    </div>
    <div>
        <h3 class="video">Youtube VIDEO</h3><br>
        <iframe width="300" height="200" src="https://www.youtube.com/embed/fhoDRB53DwY?si=hHJ0TqPq5nw-ukWO" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    </div>
</body>
</html>
