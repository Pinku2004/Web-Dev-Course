<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sizes</title>
    <style>
      *{
            margin:0;
            padding:0;
        }
        .box{
            border: 2px solid brown;
            display:inline-block;
            margin:10px;
            padding:20px;
            box-shadow: 5px 5px 5px 10px pink inset ;
        }
        .box1{
            border: 2px solid blue;
            display:block;
        }
    </style>
</head>
<body>
    <div class="box">
        I am  a box
    </div>
    <div class="box">
        I am another box;
    </div>
    <span class="box1">
        Hey I am span
    </span>
</body>
</html>
