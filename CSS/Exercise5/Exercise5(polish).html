<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 5</title>
    <style>
        *{
            margin:0;
            padding:0;
        }
        body{
            background: black;;
        }
        header{
            position:sticky;
            top:0;
        }
        nav{
            background-color: rgb(236, 149, 236);

        ul{

        li{

        .container{

            height:50vh;
            width:40%;

            margin:0px 30px;
        }
        .box2{

            height:50vh;
            width:40%;

            margin:0px 30px;
        }
        .text-box{

            color:white;
            border-radius: 10px;
            height:50px;
            padding:34px;
            margin: 10px 34vw;
            font-size:2em;
        }
        .icon{
            background-color: orange;
            border-radius:60px;
            width:15px;
            height:15px;
            position:fixed;
            bottom:62px;
            right:23px;
        }
        footer{
            height:50px;
            background-color:rgb(224, 224, 237);
            position:fixed;
            bottom:0;
            left:0;
            width:100vw;
        }

</head>
<body>
    <header>
        <nav>
            <ul>
                <li>Home</li>
                <li>About</li>
                <li>Contact</li>

    </header> 
    <main >

        </div>

        </div>

    <footer>

    </footer>
