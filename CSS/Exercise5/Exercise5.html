<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 5</title>
    <style>
        *{
            margin:0;
            padding:0;
        }
        nav{
            position:sticky;
        }
        nav ul{
            display:flex;
            background-color: purple;
            position:sticky;
            width:100vw;
        }
        nav ul li{
            list-style:none;
            padding:10px;
            margin:5px;
            color:white;
        }
        .boxes{
            width:100vw;
            height:300px;
            background-color: blue;
            display:flex;
        }
        .box{

            height:200px;
            background-color:aqua;
            padding: 40px 0px 0px 0px;
            margin:30px;
        }
        div p{
            border: 2px solid black;
            border-radius:20px;
            font-size:25px;
            padding:40px;
            margin:100px;
            text-align:center;
        }
        div img{
            border:2px solid blue;
            width:50px;
            height:50px;
            position: absolute;
            position:fixed; 
            bottom:7cqw;
            right:20px;
        }
        footer{
            /* padding:100px; */
            background-color: brown;
            position: relative;
            position:fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 50px;
        }
    </style>
</head>
<body>
    <nav>
        <ul>
            <li>Home</li>
            <li>About</li>
            <li>Contact</li>
            <li>Settings</li>
        </ul>
    </nav>
    <div>
        <div class="boxes">

        </div>
    </div>
    <div>
        <p>Welcome to this Sigma Web Development Express</p>
    </div>
    <div>

    </div>
    <footer>
    </footer>
