<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Transform</title>
    <style>
        .box{
            height:50px;
            width:50px;
            background-color:antiquewhite;
            border:1px solid black;
            /* transform:rotate(0.75turn); */
            transform:scale3d(1 , 0.7 , 0.5);
            display:flex;
            justify-content:center ;
            align-items:center;
            transform: translate(40px) skewX(20deg) rotate(0.5turn);
        }
        .container{
            height:80vh;
            width:100vw;
            border:2px solid purple;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">My Box</div>
    </div>
</body>
</html>
