<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise3</title>
    <style>
        body{
            background-color: #808080;
        }
        .box{
            background-color: white;
            height:100vh;
            width:50vw;
            border-radius:10px;
            display:block;
            margin:auto;
        }
        .img{
            height:50vh;
            width:48vw;
            border-radius:10px;
            border:2px solid black;
            display:block;
            margin:auto;
            position: relative;
            top:10px;
        }
        .rectangle{
            margin:5px;
            padding:5px;
            border:1px solid grey;
            border-radius: 10px;
        }
        .section{
            border: 2px solid orange;
            padding:40px;
            margin:10px;
            border-radius: 10px;
        }
        .content{
           border: 2px solid blue;;
            padding:5px;
            margin:10px;
            border-radius: 10px; 
        }
        /* .nature{
            position:absolute;
            top:400px;
            margin:15px;
        }
        .car{
            position:absolute;
            top:400px;
            left:450px;
            margin:15px;
        } */
        .button{
            border-radius:20px;
            display:block;
            margin:auto;
            background-color: lightblue;
            padding:10px;
        }
    </style>
</head>
<body>
    <div class="box">
        <div>
            <img class="img" src="car.jpg" alt="Car Image">
        </div>
        <div class="section">
            <span class="rectangle nature"> Nature</span>
            <span class="rectangle car"> Car</span>
        </div>
        <div class="content">
            <h1>Car Driving</h1>
            <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Aliquid, ut in ratione possimus voluptas neque velit sit porro! Soluta ipsa ad ratione perspiciatis.</p>
        </div>
        <div>
            <button class="button">Read more</button>
        </div>
    </div>
</body>
</html>
