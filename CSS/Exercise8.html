<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 8</title>
    <style>
        *{
            padding:0;
            margin:0;
        }
        .container{
            background-color: blue;
            width:70vw;
            height:80vh;
            position:relative;
        }
        .box{
            background-color: red;
            width:90px;
            height:90px;
            border-radius:70px;
            position:absolute;
            bottom:0px;
            animation: animateX 3s linear infinite,
                       animateY 1s ease-out infinite alternate;
        }
        @keyframes animateX{
            from{
                left:0%;
            }
            to{
                left:100%;
            }
        }
        @keyframes animateY{
            from{
                bottom:0;
            }
            to{
                bottom:85%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box"></div>
    </div>
</body>
</html>
