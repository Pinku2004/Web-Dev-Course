<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Media Query</title>
    <style>
        body{
            background-color: aqua;
        }
        .boxes{
            display:flex;
        }
        .box{
            width:300px;
            height:300px;
            border:2px solid purple;
            margin:5px;
        }
        @media only screen and (max-width:455px){
            body{
                background-color:chocolate;
            }
            .boxes{
                flex-direction:column;
            }
        }
        /* @media screen and (orientation:portrait){
            .boxes{
                flex-direction:column;
            }
        } */
    </style>
</head>
<body>
    <div>
        I am a website with background color aqua;
    </div>
    <div class="boxes">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
    </div>
</body>
</html>
