<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Box Model</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Iosevka+Charon:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <style>
        .box{
            color:blue;
        }
        .box1{
            background-color: aqua;
            padding: 10px;
            margin:5px;
            border: 2px solid black;
            height:200px;
        }
        .box2{
            font-size:30px ;
        }
        .lorem{
            border: 2px solid blue;
            width: 50px;
            /* text-overflow: ellipsis; */
            /* overflow:scroll; */
            word-break:break-all;
        }
    </style>
</head>
<body>
    <div class = "box box1">
        Hey I am div;
    </div>
    <p class="lorem"> Lorem ipsum dolor sit amet, consectetur adipisicing elit. In omnis, quia fugit totam iure maxime distinctio officia numquam velit at nam harum laboriosam soluta sequi qui voluptas similique sit voluptate.;</p>
    <div class = "box box2">
        Hey I a another div;
    </div>
</body>
</html>
